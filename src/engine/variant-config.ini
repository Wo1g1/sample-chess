# Custom 6x6 Variant Chess Configuration
# For Fairy-Stockfish

[CustomChess6x6:chess]
# Board dimensions
maxRank = 6
maxFile = 6

# Starting position
# l=Leaper, b=Bishop, q=Queen, k=King, n=Knight, r=Rook, p=Pawn
startFen = lbqknr/pppppp/6/6/PPPPPP/LBQKNR w - - 0 1

# Piece definitions using Betza notation

# Pawn: 앞+좌우 1칸 이동(fsmW) + 대각선 앞 캡처(fcF)
# fsmW = forward+sideways move-only Wazir (앞과 좌우 직선 이동만)
# fcF = forward capture-only Ferz (앞 대각선 캡처만)
# Reference: Chak variant uses customPiece4 = p:fsmWfceF
customPiece1 = p:fsmWfcF
pawnTypes = p

# Knight: 표준 나이트
knight = N

# Bishop: 대각선 최대 3칸(B3) + 직선 1칸(W)
# B3 = 대각선 3칸까지, W = 직선 1칸
customPiece2 = b:B3W

# Rook: 직선 최대 3칸(R3) + 대각선 1칸(F)
# R3 = 직선 3칸까지, F = 대각선 1칸
customPiece3 = r:R3F

# Leaper: 8방향 2칸 점프 (Alibaba = Alfil + Dabbaba)
# A = Alfil (대각선 2칸 점프, 뛰어넘기 가능)
# D = Dabbaba (직선 2칸 점프, 뛰어넘기 가능)
# 테스트용 단순화: Mann 제거, 8방향 2칸만
customPiece4 = l:AD

# Queen: 표준 퀸 (무제한)
# 테스트용 단순화: 거리 제한 제거
queen = Q

# King: 표준 킹 (8방향 1칸)
king = K

# General: 폰 승격 시, King과 동일 (8방향 1칸)
customPiece5 = g:K

# Promotion rules
promotionRank = 6
promotionPieceTypes = g

# Game ending conditions
# King을 잡으면 게임 종료
extinctionValue = loss
extinctionPieceTypes = k

# Stalemate is draw
stalemateValue = draw

# 50 move rule
nMoveRule = 50

# Allow 3-fold repetition draw
perpetualCheckIllegal = false
